<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Aditya Narayan Barik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F6F6F6;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 480px; }
    .logo {
      width: 72px; height: 72px; border-radius: 16px;
      background: #991b1b; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 2rem;
    }
    .logo span {
      font-family: 'Sora', sans-serif; font-weight: 700;
      font-size: 28px; color: #fff;
    }
    h1 {
      font-family: 'Sora', sans-serif; font-size: 96px;
      font-weight: 800; color: #991b1b; line-height: 1;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-family: 'Sora', sans-serif; font-size: 1.25rem;
      font-weight: 600; color: #1a1a1a; margin-bottom: 0.75rem;
    }
    p { color: #6b7280; font-size: 0.875rem; margin-bottom: 2rem; }
    a {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem; border-radius: 6px;
      background: #991b1b; color: #fff; text-decoration: none;
      font-size: 0.875rem; font-weight: 600;
      transition: all 0.3s;
    }
    a:hover { background: #7f1d1d; transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>A</span></div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
